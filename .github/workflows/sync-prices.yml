name: Sync BazarGoo prices
on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Sync products from bazargoo.com
        run: python3 sync-products.py
      - name: Commit updated prices (only if something changed)
        run: |
          git config user.name "bazargoo-sync"
          git config user.email "bazargoo-sync@users.noreply.github.com"
          git add products.json
          git diff --cached --quiet || git commit -m "Auto-sync prices from bazargoo.com"
          git push
